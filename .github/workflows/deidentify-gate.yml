name: deidentify-gate

on:
  push:
  pull_request:

jobs:
  deidentify-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run de-identification gate
        run: bash scripts/deidentify-gate.sh

  # domain 測試只用 node:test，不需要 npm ci
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run domain tests (edcAnalysis / edcOutlier / edcShift)
        working-directory: server
        run: npm run test:domain
